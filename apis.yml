aid: wenrix
name: Wenrix
description: >-
  Wenrix is an AI infrastructure company for the travel industry, providing
  embedded AI that helps Online Travel Agencies (OTAs) and Travel Management
  Companies (TMCs) drive revenue and operational efficiency from search through
  post-trip servicing. Founded in 2017 and backed by Insight Partners, Wenrix
  processes roughly $12 billion in annual air volume across 60+ global OTAs and
  TMCs. Its platform is delivered as three API-first products: FareSight, a
  predictive price-assurance engine that optimizes pricing across EDIFACT, NDC,
  GDS, aggregators, and low-cost carriers at both search and post-booking
  stages; FlexEngine, a flight-flexibility solution offering short- and
  long-term flexibility, refund guarantees, and price-lock through a single API;
  and DeepFlow, a post-booking servicing automation layer that automates
  cancellations, refunds, and changes at 93%+ automation rates and is available
  as either an API or an MCP (Model Context Protocol) Server. Wenrix operates
  from offices in Tel Aviv, New York, and Barcelona.
